<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DenounceBeasts - Sistema de gestión territorial desarrollado con TypeScript puro">
    <meta name="keywords" content="typescript, crud, educativo, municipios, distritos">
    <meta name="author" content="ITLA Students">
    
    <title>DenounceBeasts TypeScript</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Meta tags para redes sociales -->
    <meta property="og:title" content="DenounceBeasts TypeScript">
    <meta property="og:description" content="Sistema de gestión territorial con TypeScript puro">
    <meta property="og:type" content="website">
    
    <!-- Preconexiones para mejor performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <!-- Critical CSS inline para mejor performance -->
    <style>
        /* Critical CSS para evitar FOUC (Flash of Unstyled Content) */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .loading-subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        /* Ocultar contenido principal hasta que cargue */
        #app {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        #app.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga inicial -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">DenounceBeasts TypeScript</div>
        <div class="loading-subtitle">Cargando aplicación...</div>
    </div>
    
    <!-- Contenedor principal de la aplicación -->
    <div id="app">
        <!-- El contenido se generará dinámicamente con TypeScript -->
        <noscript>
            <div style="text-align: center; padding: 2rem; background: #fff; margin: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h2 style="color: #dc3545; margin-bottom: 1rem;">JavaScript Requerido</h2>
                <p style="color: #6c757d; margin-bottom: 1rem;">
                    Esta aplicación requiere JavaScript para funcionar correctamente.
                </p>
                <p style="color: #6c757d;">
                    Por favor, habilite JavaScript en su navegador e intente nuevamente.
                </p>
            </div>
        </noscript>
    </div>
    
    <!-- Scripts críticos inline -->
    <script>
        // Función para ocultar la pantalla de carga
        window.hideLoadingScreen = function() {
            const loadingScreen = document.getElementById('loading-screen');
            const app = document.getElementById('app');
            
            if (loadingScreen && app) {
                loadingScreen.style.opacity = '0';
                app.classList.add('loaded');
                
                setTimeout(() => {
                    if (loadingScreen.parentNode) {
                        loadingScreen.parentNode.removeChild(loadingScreen);
                    }
                }, 300);
            }
        };
        
        // Manejo de errores global
        window.addEventListener('error', function(event) {
            console.error('Error global capturado:', event.error);
            
            // En desarrollo, mostrar error detallado
            if (window.location.hostname === 'localhost') {
                console.group('🚨 Error Details');
                console.error('Message:', event.message);
                console.error('Filename:', event.filename);
                console.error('Line:', event.lineno);
                console.error('Column:', event.colno);
                console.error('Stack:', event.error?.stack);
                console.groupEnd();
            }
        });
        
        // Manejo de promesas rechazadas
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Promesa rechazada no manejada:', event.reason);
        });
        
        // Performance monitoring
        window.addEventListener('load', function() {
            setTimeout(() => {
                if ('performance' in window) {
                    const perfData = performance.getEntriesByType('navigation')[0];
                    console.log('⚡ Performance Stats:');
                    console.log(`- DOM Content Loaded: ${Math.round(perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart)}ms`);
                    console.log(`- Load Complete: ${Math.round(perfData.loadEventEnd - perfData.loadEventStart)}ms`);
                    console.log(`- Total Load Time: ${Math.round(perfData.loadEventEnd - perfData.navigationStart)}ms`);
                }
            }, 0);
        });
        
        // Detectar si el usuario está offline
        window.addEventListener('online', function() {
            console.log('🌐 Conexión restaurada');
            // Aquí podrías sincronizar datos pendientes
        });
        
        window.addEventListener('offline', function() {
            console.log('📵 Sin conexión a internet');
            // Aquí podrías mostrar un banner de offline
        });
        
        // Logging para desarrollo
        if (window.location.hostname === 'localhost') {
            console.log('🚀 DenounceBeasts TypeScript iniciando...');
            console.log('🔧 Modo desarrollo activo');
            console.log('📊 Monitoring de performance habilitado');
        }
    </script>
    
    <!-- Los scripts de la aplicación se inyectarán aquí automáticamente por Webpack -->
</body>
</html>
